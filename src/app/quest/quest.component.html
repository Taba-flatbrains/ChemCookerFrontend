<div class="box" (click)="selectQuest()" [style.border-color]="backgroundColor" [style.border-width]="borderWidth">  
    <div class="row-flex">
        <div *ngIf="true_smile" #molSVG (click)="selectQuest()" [innerHTML]="svg"></div>
        <div *ngIf="text" class="textbox text-smile" [style.width]="!true_smile ? EstimateSizeText(text!).width + 'px': null" [style.height]="!true_smile ? EstimateSizeText(text!).height + 'px' : null" [innerHTML]="'<p>'+text+'</p>'"></div>
    </div>
    <div class="text-flex">
        <p *ngIf="self.reward_skillpoints > 0 || self.reward_misc">Reward:</p>
        <p *ngIf="self.reward_skillpoints == 1">{{self.reward_skillpoints + "Skillpoint"}}</p>
        <p *ngIf="self.reward_skillpoints > 1">{{self.reward_skillpoints + "Skillpoints"}}</p>
        <p *ngIf="self.reward_misc">Misc: {{self.reward_misc}}</p>
    </div>
</div>
