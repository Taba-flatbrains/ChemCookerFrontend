<drag-scroll style="width: 50vh; height: 50vh;" *ngIf="skilltreeService.allSkilltreeNodes.length > 0">
    <div class="flex-column">
        <p class="skillpoint-display">{{skilltreeService.skillpoints}}</p>
        <div class="flex-row" *ngFor="let y of range(-3, 10)">
            <div *ngFor="let x of range(-10, 10)">
                <div style="width: 140px; height: 140px;">
                    <div *ngIf="skilltreeService.nodesDict[x][y]" class="node">
                        <div class="flex-row" style="flex-grow: 1;">
                            <div class="placeholder"></div>
                            <div class="vline" [style.visibility]="skilltreeService.nodesDict[x][y-1] ? 'visible' : 'hidden'"
                            [style.border-left-style]="skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y-1]!) && skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y]!) ? 'solid' : 'dotted'"></div>
                            <div class="placeholder"></div>
                        </div> <!-- top row-->
                        <div class="flex-row">
                            <div class="hline" [style.visibility]="skilltreeService.nodesDict[x-1][y] ? 'visible' : 'hidden'"
                            [style.border-top-style]="skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x-1][y]!) && skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y]!) ? 'solid' : 'dotted'"></div>
                            <app-skilltree-node [self]="skilltreeService.idToNodeDict[skilltreeService.nodesDict[x][y]!]" [unlocked]="skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y]!)"
                            *ngIf="skilltreeService.nodesDict[x][y]" [centerOnLoad]="skilltreeService.nodesDict[x][y]! == skilltreeService.unlockedSkilltreeNodes.at(-1)"></app-skilltree-node>
                            <div class="hline" [style.visibility]="skilltreeService.nodesDict[x+1][y] ? 'visible' : 'hidden'"
                            [style.border-top-style]="skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x+1][y]!) && skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y]!) ? 'solid' : 'dotted'"></div>
                        </div> <!-- middle row -->
                        <div class="flex-row" style="flex-grow: 1;">
                            <div class="placeholder"></div>
                            <div class="vline" [style.visibility]="skilltreeService.nodesDict[x][y+1] ? 'visible' : 'hidden'"
                            [style.border-left-style]="skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y+1]!) && skilltreeService.unlockedSkilltreeNodes.includes(skilltreeService.nodesDict[x][y]!) ? 'solid' : 'dotted'"></div>
                            <div class="placeholder"></div>
                        </div> <!-- bottom row -->
                    </div>
                </div>
            </div>
        </div> 
    </div>
</drag-scroll>
